# Render Blueprint for the aisistent staging environment (M3).
# Everything runs in Frankfurt; Render cannot move a service or database to
# another region later. Production gets its own Blueprint/environment once
# staging has passed the M3 checks.
#
# Secrets: DATABASE_ADMIN_URL comes from the database; DATABASE_APP_PASSWORD
# is generated by Render. Nothing secret is stored in this file.

services:
  - type: web
    name: aisistent-staging-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: demo
    buildCommand: npm ci && npm run build
    # Applies migrations as the database owner and refreshes the restricted
    # aisistent_app login before each deploy goes live.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: aisistent-staging-db
          property: connectionString
      - key: DATABASE_APP_PASSWORD
        generateValue: true
      # Sign-in (Auth0, EU tenant). Enter these in the dashboard; never commit them.
      # APP_BASE_URL is this service's public https URL, without a trailing slash.
      - key: APP_BASE_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      # Encrypts session cookies and the stored session payloads.
      - key: AUTH0_SECRET
        generateValue: true
      # Must be "true" before real customer data; requires an MFA factor in the tenant.
      - key: AUTH_REQUIRE_MFA
        value: "false"

databases:
  - name: aisistent-staging-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: aisistent
    # No external connections; only services on Render's private network.
    ipAllowList: []
